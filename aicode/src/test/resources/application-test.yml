spring:
  threads:
    virtual:
      enabled: true
  datasource:
    tidb:
      name: h2-test-tidb
      url: jdbc:h2:mem:aicode_test_tidb;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password: sa
      driver-class-name: org.h2.Driver
      type: com.alibaba.druid.pool.DruidDataSource
      initialSize: 2
      maxActive: 10
      minIdle: 1
      maxWait: 10000
      validationQuery: SELECT 1
      testWhileIdle: true
  sql:
    init:
      # 说明：schema/data 初始化由 TestDatabaseInitializer 显式执行
      # （见 src/test/java/com/aicode/support/TestDatabaseInitializer.java），
      # 因此这里设为 never。
      #
      # 为什么不用 Boot 自动初始化：本类自定义了名为 tidbDataSource 的 DataSource Bean，
      # 而 SqlInitializationAutoConfiguration 的绑定与属性前缀依赖于
      # DataSourceProperties 的 name（此处为 h2-test-tidb），与自定义 Bean 名不一致，
      # 结果是自动初始化器不会作用于业务库，表现为
      # 「Table "FRAMEWORKS" not found」。
      #
      # 历史背景：此前之所以能与 mode=always 共存，是因为项目还存在第二个
      # uidDataSource（标了 @Primary）供 Boot 绑定，且业务表恰好不在被初始化的那个库里。
      # 该数据源已随百度 UID 组件一并移除（见
      # openspec/changes/archive/2026-10-14-replace-baidu-uid-generator），
      # 故改为由 TestDatabaseInitializer 全权负责，避免再依赖这种巧合。
      mode: never
  h2:
    console:
      enabled: false

management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        exclude: "*"

logging:
  level:
    com.aicode: WARN
    org.springframework: WARN
    org.mybatis: WARN
    com.zaxxer.hikari: ERROR
