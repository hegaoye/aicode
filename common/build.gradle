apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'io.spring.dependency-management'

// 引入 Spring Boot BOM，使本模块能解析无版本声明的依赖（如 lombok、junit-jupiter）。
// aicode 模块通过 Spring Boot Gradle 插件自带该能力，此处需显式应用。
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

java {
    // 三个模块共用同一 toolchain，语言级别不可能漂移。
    // （此前各模块独立声明 sourceCompatibility，理论上可以不一致。）
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

repositories {
    maven { url = uri("https://plugins.gradle.org/m2/") }
    maven { url = uri("https://repo.spring.io/milestone") }
    maven { url = uri("https://maven.jahia.org/maven2") }
    mavenCentral()
}


dependencies {
    //-----------jwt Nimbus JOSE+JWT  start--------------
    implementation 'com.auth0:java-jwt:4.4.0'
    //-----------jwt Nimbus JOSE+JWT  end--------------

    //----------- commons  start--------------
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    //-----------commons   end--------------

    // hutool-all（2.6MB 胖包，含 json/crypto/jwt/poi/http/db 等 18 个零调用子包）
    // 替换为 hutool-core。本模块对 hutool 的实际调用点为 0（仅 facade / aicode 使用），
    // 保留坐标以便实现类经此传递获得。
    implementation 'cn.hutool:hutool-core:5.8.40'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.49'
    // JGit 6.6.0：core + http.apache 子模块
    // 升级理由：JGit 4.9.2 默认 JDKHttpConnectionFactory → HttpURLConnection → sun.* static init
    // 被 CDS archive 跳过 → clone 残缺（只下载 1 个文件）。修复：6.6.0 + http.apache 子模块
    // 切到 Apache HttpClient 4.x transport（HttpClientConnectionFactory），不依赖 sun.*，
    // CDS 友好。详见 openspec/changes/upgrade-jgit-6/
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.6.0.202305301015-r'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.http.apache:6.6.0.202305301015-r'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.belerweb:pinyin4j:2.5.0'

    // 口令散列（BCrypt）—— PasswordHasher 只需 BCryptPasswordEncoder，
    // 不引 spring-security 全家桶。common 经 dependencyManagement 导入
    // spring-boot-dependencies BOM，版本由 BOM 管理、不显式写（AGENTS §6.1）。
    implementation 'org.springframework.security:spring-security-crypto'
    // ⚠️ 必须显式补：Boot BOM 把 spring-security-crypto 对 spring-core 的依赖
    // 标为 optional，不显式加会在**运行期**抛 NoClassDefFoundError
    // （BCryptPasswordEncoder 内部用到 org.springframework.util.StringUtils），
    // 而编译期不报错 —— 这类失败只在跑测试/启动时才暴露。
    // 注：spring-core 是 Spring 基础库（非 spring-web），不违反 AGENTS §5.2 的红线。
    implementation 'org.springframework:spring-core'
    implementation 'net.lingala.zip4j:zip4j:1.3.2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //----------- test  start--------------
    // 本模块未引入 spring-boot-starter-test，故显式声明 junit-jupiter；
    // 版本由 Spring Boot BOM 管理（见本文件 dependencyManagement 块的 BOM import）
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 要求 JUnit Platform Launcher 显式出现在测试运行期类路径。
    // 缺失时 :common:test 会以 "Could not start Gradle Test Executor" 整体失败，
    // 导致本模块的测试从未真正执行过（aicode 模块由 spring-boot-starter-test 传递带入，故不受影响）。
    // 版本同样由 Spring Boot BOM 管理。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    //----------- test  end--------------
}

test {
    useJUnitPlatform()
    // 把 -Dnetwork.tests=true 传给 test fork，启用需要网络的吸烟枪测试
    if (project.hasProperty('network.tests')) {
        systemProperty 'network.tests', project.property('network.tests')
    }
}