apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'io.spring.dependency-management'

// 引入 Spring Boot BOM，使本模块能解析无版本声明的依赖（如 lombok、junit-jupiter）。
// aicode 模块通过 Spring Boot Gradle 插件自带该能力，此处需显式应用。
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

java {
    // 三个模块共用同一 toolchain，语言级别不可能漂移。
    // （此前各模块独立声明 sourceCompatibility，理论上可以不一致。）
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

[compileJava, compileTestJava, javadoc]*.options*.encoding = "UTF-8"

repositories {
    maven { url = uri("https://plugins.gradle.org/m2/") }
    maven { url = uri("https://repo.spring.io/milestone") }
    maven { url = uri("https://maven.jahia.org/maven2") }
    mavenCentral()
}

dependencies {
    // 本模块全部源码只用到 io.swagger.v3.oas.annotations.media.Schema 一个注解类型，
    // 且对 org.springframework.* / jakarta.* 的 import 数为 0（契约模块不应依赖 Web 栈）。
    // 因此不引入 springdoc 的 webmvc-ui 聚合包（它会拖入 Spring Web MVC + Servlet +
    // Jackson 2 + swagger-core 整条链），改用仅提供注解的最小构件。
    // 运行时 OpenAPI 文档生成由 aicode 模块持有的完整 springdoc starter 负责。
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.55'
    // hutool-all（2.6MB 胖包）替换为 hutool-core：本模块只用 DateUtil，且属 hutool-core。
    // 统一版本到 5.8.40，与 common / aicode 对齐（原 5.8.25 曾被 Gradle 取高版本覆盖，
    // 导致编译期与运行期不一致）。
    implementation 'cn.hutool:hutool-core:5.8.40'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.49'

    implementation project(path: ":common")
    implementation 'com.baomidou:mybatis-plus-extension:3.5.17'
    // MyBatis-Plus 3.5.9+ 把 IService / ServiceImpl 从 extension.service 迁到
    // mybatis-plus-spring 模块的 com.baomidou.mybatisplus.spring.service 包。
    // facade 的 Service 接口继承 IService，故需显式引入该模块。
    implementation 'com.baomidou:mybatis-plus-spring:3.5.17'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 版本由 Spring Boot BOM 管理（见本文件 dependencyManagement 块的 BOM import）
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 要求 JUnit Platform Launcher 显式出现在测试运行期类路径。
    // 本模块当前尚无测试（见 AGENTS.md §7.1 空白点），但一旦补测即会踩到
    // 与 common 相同的 "Could not start Gradle Test Executor" 故障，故预先补齐。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

test {
    useJUnitPlatform()
}