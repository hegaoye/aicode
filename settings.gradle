// 插件版本统一在此声明，供各子模块用 `apply plugin: '...'` 方式应用时解析。
// AGENTS.md §10 提示「编辑根 build.gradle 无效」—— 那条针对 repositories / dependencies，
// 但 plugins 的版本解析必须在这里声明，否则子模块的 apply plugin 找不到插件。
plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

include 'common'
include 'facade'

include 'aicode'

// 前端模块。Jar 内部布局为 static/**，aicode 以 implementation project(':aicode-web')
// 引入后，Spring Boot 会从 classpath 的 /static/ 提供页面 —— 无需任何资源拷贝任务。
// 详见 openspec/changes/add-aicode-web-openapi-contract-chain/design.md - D4
include 'aicode-web'
